<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11152b"><link rel="stylesheet" href="./style.css"><title>pong</title></head><body><main><section id="play" hidden aria-label="Pong"><div class="game-toolbar"><button id="back" aria-label="Zpět na hry">←</button><h2><span>✦</span> PONG <span>✦</span></h2><button id="pause" aria-label="Pozastavit">Ⅱ</button><button id="settingsOpen" aria-label="Nastavení">⚙</button></div><div class="scoreboard"><span class="player mint" id="opponent">Počítač</span><div class="score"><b id="scoreTop">00</b><span>:</span><b id="scoreBottom">00</b></div><span class="player violet" id="you">Ty</span></div><div class="stage"><div class="touch-pad mint-pad" id="topPad" aria-label="Ovládání horního hráče"><div class="pad-content"><strong>TÁHNI VLEVO / VPRAVO</strong><span class="track"><i></i></span></div></div><div class="court-wrap"><canvas id="court" width="600" height="900" aria-label="Hřiště Pong. Ovládací pás je pod hřištěm."></canvas><div id="overlay" hidden><h3 id="overlayTitle"></h3><p id="overlayText"></p><button id="resume">Pokračovat</button></div></div><div class="touch-pad violet-pad" id="bottomPad" aria-label="Ovládání tvé pálky"><div class="pad-content"><strong>TÁHNI VLEVO / VPRAVO</strong><span class="track"><i></i></span></div></div></div><div id="live" class="sr-only" role="status" aria-live="polite"></div></section><dialog id="settings"><div class="dialog-heading"><h2>Nastavení hry</h2><button id="settingsClose" aria-label="Zavřít">×</button></div><p>První na 7 bodů vyhrává.</p><div class="settings-row"><button id="solo">1 hráč · počítač</button><button id="duo">2 hráči</button></div><div class="settings-row"><button id="rotate">↻ Otočit hřiště</button><button id="autoRotate">Podle displeje</button></div><div class="settings-row"><button id="gameFullscreen">⛶ Celá obrazovka</button><button id="restart">↻ Nová hra</button></div><p class="hint">Táhni v ovládacím pásu mimo hřiště. Pro dva hráče fungují oba pásy současně.<br><br>Klávesnice: ← / → nebo A / D pro tebe, J / L pro soupeře. Mezerník: pauza.</p></dialog></main><div id="toast" role="status"></div><script data-module-id="pong" src="./bridge.js"></script><script src="./game.js"></script></body></html>
