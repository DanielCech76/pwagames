<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Objekty v kameře</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main hidden>
    <header>
      <button id="back">← Kolekce</button>
      <h1>Objekty v kameře</h1>
    </header>
    <div id="view">
      <video playsinline muted></video>
      <canvas id="still" hidden></canvas>
      <canvas id="overlay" aria-hidden="true"></canvas>
      <p id="empty">Zapni kameru a namiř ji na předměty s dobře viditelnými okraji.</p>
    </div>
    <div class="controls">
      <button id="camera">Zapnout kameru</button>
      <button id="live" aria-pressed="true" disabled>Živě</button>
      <button id="snapshot" aria-pressed="false" disabled>Snímek</button>
    </div>
    <p id="status" role="status">Kamera je vypnutá.</p>
    <p class="note">Experimentální detekce podle barev a hran. Obraz zůstává v telefonu.</p>
  </main>
  <script data-module-id="kamera-objekty" src="./bridge.js"></script>
  <script type="module" src="./camera.js"></script>
</body>
</html>
