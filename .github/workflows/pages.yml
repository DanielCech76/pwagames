name: Test and deploy modular PWA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build immutable module packages and core
        run: python scripts/build-site.py
      - name: Validate packages and run regression checks
        run: |
          python scripts/check-build.py
          node tests/packages.test.mjs
          node tests/worker.test.cjs
          node tests/bridge.test.cjs
          node tests/migration.test.cjs
          node tests/pinball-engine.test.cjs
          node tests/phone-lab.test.cjs
          node tests/pong-motion.test.cjs
          node tests/pong-ui.test.cjs
          node tests/module-data.test.cjs
          node tests/large-data-integration.test.cjs
          node tests/cyklo-engine.test.cjs
          node tests/cyklo-store.test.cjs
          node tests/cyklo-camera.test.cjs
          node tests/cyklo-ui.test.cjs
          node tests/cyklo-map.test.cjs
          node tests/cyklo-navigation.test.cjs
          node tests/cyklo-planner.test.cjs
          node tests/cyklo-elevation.test.cjs
          node tests/cyklo-appearance.test.cjs
          node tests/cyklo-controls.test.cjs
          node tests/azulejo-module.test.cjs
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
